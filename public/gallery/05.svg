<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Paper-craft illustration: string lights above the stone steps">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2320"/>
      <stop offset="0.6" stop-color="#5a4a3c"/>
      <stop offset="1" stop-color="#b0967a"/>
    </linearGradient>
    <radialGradient id="bulb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd79a" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#ffc46b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffc46b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#night)"/>

  <!-- Tree masses either side -->
  <g fill="#2a2320" opacity="0.55">
    <ellipse cx="90" cy="180" rx="200" ry="170"/>
    <ellipse cx="1130" cy="150" rx="220" ry="180"/>
    <ellipse cx="60" cy="420" rx="140" ry="130"/>
  </g>

  <!-- Three swags of bulbs -->
  <g>
    <path d="M-20 120 Q 300 300 620 140 Q 920 -10 1220 160" fill="none" stroke="#e8ddc9" stroke-width="2.5" opacity="0.35"/>
    <path d="M-20 250 Q 320 450 640 270 Q 940 100 1220 300" fill="none" stroke="#e8ddc9" stroke-width="2.5" opacity="0.3"/>
    <path d="M-20 380 Q 340 570 660 400 Q 960 240 1220 430" fill="none" stroke="#e8ddc9" stroke-width="2.5" opacity="0.24"/>

    <g fill="url(#bulb)">
      <circle cx="120" cy="216" r="46"/><circle cx="300" cy="284" r="46"/><circle cx="470" cy="248" r="46"/>
      <circle cx="620" cy="142" r="50"/><circle cx="790" cy="60" r="44"/><circle cx="960" cy="52" r="44"/><circle cx="1110" cy="128" r="46"/>
      <circle cx="150" cy="348" r="42"/><circle cx="340" cy="424" r="42"/><circle cx="520" cy="392" r="42"/>
      <circle cx="700" cy="272" r="42"/><circle cx="880" cy="182" r="42"/><circle cx="1060" cy="222" r="42"/>
      <circle cx="200" cy="478" r="38"/><circle cx="420" cy="546" r="38"/><circle cx="640" cy="490" r="38"/>
      <circle cx="850" cy="368" r="38"/><circle cx="1050" cy="356" r="38"/>
    </g>
    <g fill="#ffe6bd">
      <circle cx="120" cy="216" r="8"/><circle cx="300" cy="284" r="8"/><circle cx="470" cy="248" r="8"/>
      <circle cx="620" cy="142" r="9"/><circle cx="790" cy="60" r="8"/><circle cx="960" cy="52" r="8"/><circle cx="1110" cy="128" r="8"/>
      <circle cx="150" cy="348" r="7"/><circle cx="340" cy="424" r="7"/><circle cx="520" cy="392" r="7"/>
      <circle cx="700" cy="272" r="7"/><circle cx="880" cy="182" r="7"/><circle cx="1060" cy="222" r="7"/>
      <circle cx="200" cy="478" r="6"/><circle cx="420" cy="546" r="6"/><circle cx="640" cy="490" r="6"/>
      <circle cx="850" cy="368" r="6"/><circle cx="1050" cy="356" r="6"/>
    </g>
  </g>

  <!-- Stone steps, lit from above -->
  <g>
    <path d="M320 800 L880 800 L860 736 L340 736 Z" fill="#e3dacb"/>
    <path d="M340 736 L860 736 L842 682 L358 682 Z" fill="#e8ddc9"/>
    <path d="M358 682 L842 682 L826 636 L374 636 Z" fill="#e3dacb" opacity="0.9"/>
    <path d="M374 636 L826 636 L812 598 L388 598 Z" fill="#d8cdba" opacity="0.85"/>
    <path d="M388 598 L812 598 L800 566 L400 566 Z" fill="#cec2ad" opacity="0.8"/>
    <g stroke="#b0967a" stroke-opacity="0.4" stroke-width="2">
      <path d="M340 736 L860 736"/><path d="M358 682 L842 682"/><path d="M374 636 L826 636"/><path d="M388 598 L812 598"/>
    </g>
  </g>

  <!-- Lanterns on the low walls -->
  <g>
    <g fill="url(#bulb)"><circle cx="300" cy="620" r="52"/><circle cx="900" cy="620" r="52"/></g>
    <g fill="#f6efe4" opacity="0.85">
      <path d="M282 596 L318 596 L326 646 L274 646 Z"/><path d="M882 596 L918 596 L926 646 L874 646 Z"/>
    </g>
    <g fill="#ffc46b"><circle cx="300" cy="622" r="9"/><circle cx="900" cy="622" r="9"/></g>
  </g>

  <!-- Foreground foliage -->
  <g fill="#2a2320" opacity="0.45">
    <ellipse cx="140" cy="740" rx="180" ry="110"/>
    <ellipse cx="1080" cy="760" rx="200" ry="120"/>
  </g>
</svg>
